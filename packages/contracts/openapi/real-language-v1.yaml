        - basicVocabulary
        - purposeVocabularies
        - styleReference
        - voiceEnabled
        - autoPlayEnabled
        - speechSpeedLevel
      properties:
        formalityLevel:
          type: integer
          minimum: 1
          maximum: 5
        slangEnabled:
          type: boolean
        basicVocabulary:
          type: string
          enum:
            [
              PRIMARY_SCHOOL,
              JUNIOR_HIGH,
              SENIOR_HIGH,
              CET_4,
              CET_6,
              POSTGRADUATE,
              TOEFL,
              IELTS,
              GRE,
              TEM_8,
            ]
        purposeVocabularies:
          type: array
          uniqueItems: true
          maxItems: 3
          items:
            type: string
            enum: [IELTS_TOEFL, GRE, BUSINESS_ENGLISH]
        styleReference:
          type: string
        voiceEnabled:
          type: boolean
        autoPlayEnabled:
          type: boolean
        speechSpeedLevel:
          type: integer
          minimum: 1
          maximum: 5
    VersionedSettings:
      type: object
      additionalProperties: false
      required: [settings, rowVersion]
      properties:
        settings:
          $ref: "#/components/schemas/InitialSettingsCompletionRequest"
        rowVersion:
