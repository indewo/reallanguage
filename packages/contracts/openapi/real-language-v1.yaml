              $ref: "#/components/schemas/AcceptedVocabulary"
        commandId: { type: string, minLength: 1, maxLength: 128 }
    AcceptedVocabulary:
      type: object
      additionalProperties: false
      required: [display, senseZh, unitType, sourceEvidence]
      description: Optional only for a word:N request. A previously delivered current-occurrence explanation, never formal knowledge identity. Null is invalid. Before any provider request its exact complete word evidence must match N in the owning requested unit. The returned target preserves display, contextual Chinese meaning, category and complete evidence exactly. Other occurrences cannot contribute this snapshot; the existing request command is unchanged.
      properties:
        display: { type: string, pattern: '\S' }
        senseZh: { type: string, pattern: '\S' }
        unitType: { type: string, enum: [WORD, FIXED_EXPRESSION] }
        sourceEvidence:
          $ref: "#/components/schemas/RelatedVocabularyItem/properties/sourceEvidence"
    RelatedVocabularyItem:
      type: object
      additionalProperties: false
      required: [itemRef, unitId, display, senseZh, unitType, sourceEvidence]
      description: A target-local explanatory snapshot, not a selected learning target or a shared knowledge identity. It belongs to the owning target's exact focus sentence and must have the same display, category and contextual Chinese meaning as any vocabulary target at that exact span.
      properties:
        itemRef: { type: string, maxLength: 128, pattern: '\S' }
        unitId: { type: string, minLength: 1, maxLength: 128 }
        display: { type: string, pattern: '\S' }
        senseZh: { type: string, pattern: '\S' }
        unitType: { type: string, enum: [WORD, FIXED_EXPRESSION] }
        sourceEvidence:
          type: object
          additionalProperties: false
          required:
            [
              version,
              startUtf16,
              endUtf16,
              surfaceForm,
              normalizedForm,
              allowedForms,
            ]
          properties:
            version: { type: integer, const: 1 }
            startUtf16: { type: integer, minimum: 0, maximum: 9007199254740991 }
            endUtf16: { type: integer, minimum: 1, maximum: 9007199254740991 }
            surfaceForm: { type: string, pattern: '\S' }
            normalizedForm: { type: string, pattern: '\S' }
            allowedForms:
              type: array
              minItems: 1
              maxItems: 1
              items: { type: string }
    LearningTargetExtractionResult:
      type: object
      required: [targets, queryableExpressions, learningScopes]
      properties:
        targets:
          type: array
          items:
            type: object
            properties:
              relatedVocabularyItems:
                type: [array, "null"]
                description: Compatible group with relatedVocabularyItemRefs. Both absent or both null are legacy; otherwise both are arrays. Only PATTERN may have non-empty items. Every local item is referenced exactly once, with no duplicate spans or orphan definitions. These explanations never create extra learning tasks.
                items:
                  $ref: "#/components/schemas/RelatedVocabularyItem"
              relatedVocabularyItemRefs:
                type: [array, "null"]
                uniqueItems: true
                description: Resolves only against this target's relatedVocabularyItems. relatedVocabulary must equal the resolved display values in this exact order, preserving older clients' presentation.
                items: { type: string, maxLength: 128, pattern: '\S' }
              candidateExample:
                type: [object, "null"]
                additionalProperties: false
                required: [textEn, textZh]
                properties:
                  textEn: { type: string, pattern: '\S' }
                  textZh: { type: string, pattern: '\S' }
              reusedKnowledgeRef:
                type: [string, "null"]
                maxLength: 128
                pattern: '^(VOCABULARY|PATTERN):[^\s]+$'
        queryableExpressions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [expressionId, unitId, display]
            properties:
              expressionId: { type: string, minLength: 1, maxLength: 128 }
              unitId: { type: string, minLength: 1, maxLength: 128 }
              display: { type: string, minLength: 1 }
              explanationZh:
                type: string
                minLength: 1
                description: Optional only for an older provider response; current providers supply the contextual Chinese meaning before selection.
        learningScopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
              [
                PRIMARY_SCHOOL,
                JUNIOR_HIGH,
                SENIOR_HIGH,
                CET_4,
                CET_6,
                POSTGRADUATE,
                TOEFL,
                IELTS,
                GRE,
                TEM_8,
                IELTS_TOEFL,
                BUSINESS_ENGLISH,
              ]
    KnowledgeExampleGenerationRequest:
      type: object
      additionalProperties: false
      required: [itemId, targetType, display, meaningZh, sourceScene, commandId]
      properties:
        itemId: { type: string, minLength: 1, maxLength: 128 }
        targetType: { type: string, enum: [VOCABULARY, PATTERN] }
        display: { type: string, minLength: 1 }
        meaningZh: { type: string, minLength: 1 }
        sourceScene:
          type: array
          minItems: 1
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            required: [textEn, textZh]
            properties:
              textEn: { type: string, minLength: 1 }
              textZh: { type: string, minLength: 1 }
        commandId: { type: string, minLength: 1, maxLength: 128 }
    KnowledgeExampleGenerationResult:
      type: object
      additionalProperties: false
      required:
        [
          itemId,
          phonetic,
          pronunciationText,
          representativeScene,
          naturalRevalidation,
          examples,
        ]
      properties:
        itemId: { type: string, minLength: 1, maxLength: 128 }
        phonetic: { type: [string, "null"] }
        pronunciationText: { type: string, minLength: 1 }
        representativeScene: { type: string, minLength: 1 }
        naturalRevalidation: { type: [boolean, "null"] }
        examples:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required: [textEn, textZh, pronunciationText]
            properties:
              textEn: { type: string, minLength: 1 }
              textZh: { type: string, minLength: 1 }
              pronunciationText: { type: string, minLength: 1 }
    SafetyHandlingCommand:
      type: object
      additionalProperties: false
      required: [commandId]
      properties:
        commandId: { type: string, minLength: 1, maxLength: 128 }
    AccountProfile:
      type: object
      additionalProperties: false
      required: [email]
