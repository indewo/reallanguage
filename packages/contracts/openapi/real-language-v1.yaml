              chargeId: { type: string, minLength: 1, maxLength: 128 }
              amountFen: { type: integer, minimum: 0, maximum: 100000000 }
              occurredAt: { type: string, format: date-time }
              modelSource: { type: string, minLength: 1, maxLength: 128 }
              callType:
                {
                  type: string,
                  enum:
                    [
                      INITIAL_CALL,
                      AUTOMATIC_RETRY,
                      USER_RETRY,
                      PROVIDER_SWITCH,
                    ],
                }
              operationLabelZh: { type: string, minLength: 1, maxLength: 200 }
    RechargeConfiguration:
      type: object
      additionalProperties: false
      required: [recommendedOptions, minimumAmountFen, maximumAmountFen]
      properties:
        recommendedOptions:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [amountFen, visionZh]
            properties:
              amountFen: { type: integer, minimum: 1 }
              visionZh: { type: string, minLength: 1, maxLength: 300 }
        minimumAmountFen: { type: integer, minimum: 1 }
        maximumAmountFen: { type: integer, minimum: 1 }
    RechargeOrderCommand:
      type: object
      additionalProperties: false
      required: [amountFen, paymentMethod, commandId]
      properties:
        amountFen: { type: integer, minimum: 1 }
        paymentMethod: { type: string, enum: [WECHAT_PAY, ALIPAY] }
        commandId: { type: string, minLength: 1, maxLength: 128 }
    RechargeOrderResult:
      type: object
      additionalProperties: false
      required: [orderId, status, paymentLaunch]
      properties:
        orderId: { type: string, minLength: 1, maxLength: 128 }
        status:
          {
            type: string,
            enum:
              [CREATED, PENDING_PAYMENT, IN_PROGRESS, PAID, FAILED, CANCELLED],
          }
        paymentLaunch: { type: [string, "null"], minLength: 1, maxLength: 4096 }
    RefundPage:
      type: object
      additionalProperties: false
      required:
        [refundableAmountFen, refundMethodLabelZh, requestId, requestStatus]
      properties:
        refundableAmountFen: { type: integer, minimum: 0 }
        refundMethodLabelZh: { type: string, minLength: 1, maxLength: 200 }
        requestId: { type: [string, "null"], minLength: 1, maxLength: 128 }
        requestStatus:
          {
            type: [string, "null"],
            enum:
              [
                REQUESTED,
                REVIEWING,
                APPROVED,
                REFUNDED,
                REJECTED,
                FAILED,
                null,
              ],
          }
    RefundCommand:
      type: object
      additionalProperties: false
      required: [amountFen, commandId]
      properties:
        amountFen: { type: integer, minimum: 1 }
        commandId: { type: string, minLength: 1, maxLength: 128 }
    RefundResult:
      type: object
      additionalProperties: false
      required: [requestId, status]
      properties:
        requestId: { type: string, minLength: 1, maxLength: 128 }
        status:
          {
            type: string,
            enum: [REQUESTED, REVIEWING, APPROVED, REFUNDED, REJECTED, FAILED],
          }
    PaymentEventEnvelope:
      type: object
      additionalProperties: false
      required: [payloadBase64, signature, timestamp]
      properties:
        payloadBase64:
          {
            type: string,
            minLength: 1,
            maxLength: 16384,
            pattern: "^[A-Za-z0-9+/]+={0,2}$",
          }
        signature:
          {
            type: string,
            minLength: 1,
            maxLength: 512,
            pattern: "^[A-Za-z0-9+/]+={0,2}$",
          }
        timestamp: { type: string, pattern: "^[0-9]{10}$" }
    MinorRechargeSupportCommand:
      type: object
      additionalProperties: false
      required: [commandId]
