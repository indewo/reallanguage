      type: object
      additionalProperties: false
      required: [chapter, focusSentenceId, round, commandId]
      properties:
        chapter:
          $ref: "#/components/schemas/FixedExplanationChapter"
        focusSentenceId:
          type: string
          minLength: 1
          maxLength: 128
        round:
          type: integer
          minimum: 1
          maximum: 3
        existingBaseExplanationZh:
          type: string
          minLength: 1
        lockedTargets:
          type: array
          description: Immutable selected targets of only the current focus sentence. Absent is legacy; an explicit empty list means no selected targets. Null and malformed snapshots are rejected before any provider call. Related vocabulary remains explanation-only even when its standalone word target was cancelled.
          items:
            $ref: "#/components/schemas/LockedExplanationTarget"
        requestedExpression:
          $ref: "#/components/schemas/RequestedExpression"
        commandId:
          type: string
          minLength: 1
          maxLength: 128
