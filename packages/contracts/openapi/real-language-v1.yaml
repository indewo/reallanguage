        commandId: { type: string, minLength: 1, maxLength: 128 }
    MinorRechargeSupportResult:
      type: object
      additionalProperties: false
      required: [supportCaseId, status]
      properties:
        supportCaseId: { type: string, minLength: 1, maxLength: 128 }
        status:
          { type: string, enum: [REQUESTED, REVIEWING, RESOLVED, REJECTED] }
    AppMessagesResponse:
      type: object
      additionalProperties: false
      required: [messages]
      properties:
        messages:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required:
              [
                messageId,
                kind,
                summaryZh,
                relatedContentLabelZh,
                createdAt,
                read,
                target,
              ]
            properties:
              messageId: { type: string, maxLength: 128 }
              kind: { type: string, enum: [MANUAL_REVIEW_RESULT, SYSTEM] }
              summaryZh: { type: string, maxLength: 2000 }
              relatedContentLabelZh: { type: [string, "null"], maxLength: 500 }
              createdAt: { type: string, format: date-time }
              read: { type: boolean }
              target:
                oneOf:
                  - type: "null"
                  - type: object
                    additionalProperties: false
                    required: [route, resourceId]
                    properties:
                      route: { type: string, const: MANUAL_REVIEW_RESULT }
                      resourceId: { type: string, maxLength: 128 }
    ManualReviewSubmissionResult:
      type: object
      additionalProperties: false
      required: [status, reviewRequestId]
      properties:
        status: { type: string, const: SUBMITTED }
        reviewRequestId: { type: string, format: uuid }
        reviewStatus:
          type: string
          enum: [PENDING, APPROVED, NOT_APPROVED]
          description: Current saved state, including an idempotent retry after an administrator decision. Optional only for legacy wire compatibility; current clients require it before choosing a destination.
    ManualReviewResult:
      type: object
      additionalProperties: false
      required: [outcome, source]
      properties:
        outcome: { type: string, enum: [APPROVED, NOT_APPROVED] }
        source:
          type: object
          additionalProperties: false
          required: [safetyCaseId, text, sourceType, contentShape, userReasonZh]
          properties:
            safetyCaseId: { type: string, maxLength: 128 }
            text: { type: string, maxLength: 100000 }
            sourceType: { type: string, enum: [DIARY, RECORDING, AI_SCENE] }
            contentShape: { type: string, enum: [ARTICLE, DIALOGUE] }
            userReasonZh: { type: string, maxLength: 2000 }
    SafetyHandlingDetails:
      type: object
      required:
        [safetyCaseId, originalSource, userReasonZh, deidentifiedSource, edits]
      properties:
        safetyCaseId: { type: string, format: uuid }
        originalSource: { type: object }
        userReasonZh: { type: string, minLength: 1 }
        deidentifiedSource: { type: object }
        edits:
          type: array
          minItems: 1
          items: { type: object }
    PasswordResetRequest:
