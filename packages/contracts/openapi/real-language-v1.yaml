openapi: 3.1.0
info:
  title: RealLanguage API
  version: 0.0.0
  description: Initial versioned contract for the engineering skeleton.
servers:
  - url: /api/v1
paths:
  /settings/current:
    get:
      operationId: getCurrentSettings
      summary: Load the authenticated account's authoritative current settings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current settings snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitialSettingsCompletionRequest"
        "401":
          description: Authentication is required
  /settings/current/revision:
    get:
      operationId: readVersionedSettings
      summary: Read settings and their optimistic-lock version for a subsequent edit
      security:
        - bearerAuth: []
      responses:
        "200":
          description: One atomic settings snapshot and version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionedSettings"
        "401":
          description: Authentication is required
        "404":
          description: Initial settings have not been completed
    put:
      operationId: updateCurrentSettings
      summary: Update existing settings with a version check, without generating or charging
      description: An identical currently stored snapshot is a read-confirmed no-op. A different snapshot with a stale version is rejected, never silently rebased. This endpoint does not complete initial settings or change fixed content.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCurrentSettingsRequest"
      responses:
        "200":
          description: The requested snapshot is stored at the returned version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateCurrentSettingsResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Authentication is required
        "404":
          description: Initial settings have not been completed
        "409":
          description: SETTINGS_VERSION_CONFLICT with the latest rowVersion; reread before a new edit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /legal/documents/{kind}:
    get:
      operationId: getAgreementDocument
      summary: Load one versioned authoritative agreement document
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [user-agreement, privacy-policy]
      responses:
        "200":
          description: Versioned agreement document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgreementDocument"
        "400":
          $ref: "#/components/responses/ValidationError"
  /settings/current/initial:
    put:
      operationId: completeInitialSettings
      summary: Atomically complete the authenticated account's first settings snapshot
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitialSettingsCompletionRequest"
      responses:
        "200":
          description: Initial settings are complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitialSettingsCompletionResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Authentication is required
  /safety/checks:
    post:
      operationId: checkContentSafety
      summary: Check one full confirmed source before semantic splitting
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SafetyCheckRequest"
      responses:
        "200":
          description: Context-aware safety decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyCheckResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Authentication is required
  /content-formation/semantic-units/split:
    post:
      operationId: splitSemanticUnits
      summary: Split one safety-approved source without rewriting it
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SemanticUnitSplitRequest"
      responses:
        "200":
          description: Exact full source coverage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemanticUnitSplitResult"
        "401":
          description: Authentication is required
  /content-formation/chapters/context-selection:
    post:
      operationId: selectChapterContext
      summary: Select and deterministically validate chapter context
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChapterContextSelectionRequest"
      responses:
        "200":
          description: Validated chapter context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChapterContextSelectionResult"
        "401":
          description: Authentication is required
  /content-formation/english-candidates:
    post:
      operationId: generateEnglishCandidates
      summary: Generate and verify faithful English candidates for every chapter unit
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnglishCandidateGenerationRequest"
      responses:
        "200":
          description: Fully fidelity-checked English candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnglishCandidateGenerationResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Authentication is required
  /content-formation/learning-targets:
    post:
      operationId: extractLearningTargets
      summary: Extract unique contextual learning targets for focus sentences
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningTargetExtractionRequest"
      responses:
        "200":
          description: Validated focus-only learning targets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningTargetExtractionResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Authentication is required
  /knowledge/examples:
    post:
      operationId: generateKnowledgeExamples
      summary: Generate one stable representative scene and exactly three examples for a fixed local knowledge target
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeExampleGenerationRequest"
      responses:
        "200":
          description: Validated temporary knowledge detail for later local chapter archival
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeExampleGenerationResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Authentication is required
  /media/recording-transcriptions:
    post:
      operationId: transcribeRecording
      summary: Transcribe an explicitly submitted local recording without retaining it as a long-term cloud file
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordingTranscriptionRequest"
      responses:
        "200":
          description: Editable Chinese transcript with semantic end-boundary evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingTranscriptionResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Authentication is required
  /media/transcript-repairs:
    post:
      operationId: repairTranscript
      summary: Propose only audio-confirmed omission or disfluency repairs after explicit user request
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscriptRepairRequest"
      responses:
        "200":
          description: No change or an explicit comparison proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptRepairResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Authentication is required
  /sources/scenes/recommendations:
    post:
      operationId: generateSceneRecommendations
      summary: Generate up to four differentiated directions from recent local fixed-source excerpts
      security: [{ bearerAuth: [] }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/SceneRecommendationRequest" },
                },
            },
        }
      responses:
        "200":
          {
            description: Optional recent directions,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        $ref: "#/components/schemas/SceneRecommendationResult",
                      },
                  },
              },
          }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { description: Authentication is required }
  /sources/scenes/next-question:
    post:
      operationId: getNextSceneQuestion
      summary: Ask one of at most ten necessary questions, generate after enough facts, or return explicit insufficiency
      security: [{ bearerAuth: [] }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/SceneNextQuestionRequest" },
                },
            },
        }
      responses:
        "200":
          {
            description: One question,
            generation boundary,
            or explicit insufficient-information result,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: "#/components/schemas/SceneNextQuestionResult" },
                  },
              },
          }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { description: Authentication is required }
  /sources/scenes/drafts:
    post:
      operationId: generateSceneDraft
      summary: Generate a bounded Chinese dialogue or article from confirmed answers
      security: [{ bearerAuth: [] }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/SceneDraftRequest" } },
            },
        }
      responses:
        "200":
          {
            description: Bounded editable Chinese draft,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/SceneDraftResult" } },
              },
          }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { description: Authentication is required }
  /sources/scenes/edit-reviews:
    post:
      operationId: reviewSceneEdit
      summary: Review only changed units for explicit factual or intelligibility problems
      security: [{ bearerAuth: [] }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/SceneEditReviewRequest" },
                },
            },
        }
      responses:
        "200":
          {
            description: Pass or precise issues without automatic rewriting,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: "#/components/schemas/SceneEditReviewResult" },
                  },
              },
          }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { description: Authentication is required }
  /learning/explanations:
    post:
      operationId: generateLearningExplanation
      summary: Generate a bounded sentence hint or contextual expression explanation from fixed local chapter content
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningExplanationRequest"
      responses:
        "200":
          description: Validated explanation for the requested fixed content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningExplanationResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Authentication is required
  /learning/explanations/deliveries/{commandId}:
    get:
      operationId: recoverExistingLearningExplanation
      summary: Read an owned existing explanation delivery without provider calls or billing writes
      security:
        - bearerAuth: []
      parameters:
        - {
            in: path,
            name: commandId,
            required: true,
            schema: { type: string, minLength: 1, maxLength: 128 },
          }
        - {
            in: query,
            name: kind,
            required: true,
            schema: { type: string, enum: [SENTENCE, EXPRESSION] },
          }
      responses:
        "200":
          description: Existing settled result or explicit unavailable state; NO_DELIVERY is not proof of no prior charge. Never initiates, claims, settles or extends a task.
          headers:
            Cache-Control:
              { schema: { type: string, const: "private, no-store" } }
          content:
            application/json:
              schema:
                {
                  $ref: "#/components/schemas/LearningExplanationRecoveryResult",
                }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { description: Authentication is required }
  /learning/reading-feedback:
    post:
      operationId: generateReadingFeedback
      summary: Generate objective non-mastery reading feedback from one short raw-audio attempt
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadingFeedbackRequest"
      responses:
        "200":
          description: Objective feedback without pass or fail authority
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingFeedbackResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Authentication is required
  /learning/speaking-transcriptions:
    post:
      operationId: generateSpeakingTranscription
      summary: Generate an editable transcript from one independent speaking attempt
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeakingTranscriptionRequest"
      responses:
        "200":
          description: Editable transcript and low-confidence evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpeakingTranscriptionResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Authentication is required
  /learning/diary-dictations:
    post:
      operationId: generateDiaryDictation
      summary: Recognize one editable diary dictation segment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiaryDictationRequest"
      responses:
        "200":
          description: Editable Chinese transcript for insertion into the diary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpeakingTranscriptionResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Authentication is required
  /learning/full-sentence-speaking-evaluations:
    post:
      operationId: evaluateFullSentenceSpeaking
      summary: Evaluate only the fifth independent full-sentence retelling
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FullSentenceSpeakingEvaluationRequest"
      responses:
        "200":
          description: Bounded content and pronunciation evidence candidate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullSentenceSpeakingEvaluationResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Authentication is required
  /learning/pattern-practice-sets:
    post:
      operationId: generatePatternPractice
      summary: Generate one to five natural new scenes for one locked pattern
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatternPracticeGenerationRequest"
      responses:
        "200":
          description: Validated practice set or explicit unavailable result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatternPracticeGenerationResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Authentication is required
  /learning/pattern-practice-feedback:
    post:
      operationId: generatePatternPracticeFeedback
      summary: Generate training-only feedback from visible-target raw audio
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatternPracticeFeedbackRequest"
      responses:
        "200":
          description: Objective feedback without mastery authority
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatternPracticeFeedbackResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Authentication is required
  /learning/pattern-independent-evaluation:
    post:
      operationId: evaluatePatternIndependent
      summary: Evaluate one hidden-target pattern response during unified review
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatternIndependentEvaluationRequest"
      responses:
        "200":
          description: Bounded independent pattern evidence candidate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatternIndependentEvaluationResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Authentication is required
  /learning/scene-response-tasks:
    post:
      operationId: generateSceneResponseTask
      summary: Fix one bounded three-round scene-response task
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SceneResponseGenerationRequest"
      responses:
        "200":
          description: Fixed task reused for all three rounds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SceneResponseGenerationResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Authentication is required
  /learning/scene-response-training-feedback:
    post:
      operationId: generateSceneResponseTrainingFeedback
      summary: Give training-only feedback for the first two rounds
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SceneResponseTrainingFeedbackRequest"
      responses:
        "200":
          description: Objective training feedback without result authority
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SceneResponseTrainingFeedbackResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Authentication is required
  /learning/scene-response-evaluations:
    post:
      operationId: evaluateSceneResponse
      summary: Evaluate only the hidden third-round scene response
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SceneResponseEvaluationRequest"
      responses:
        "200":
          description: Scene-response evidence candidate only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SceneResponseEvaluationResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Authentication is required
  /safety/cases/{safetyCaseId}/handling:
    post:
      operationId: prepareSafetyHandling
      summary: Prepare one internally validated deidentified candidate
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SafetyCaseId"
      responses:
        "200":
          description: Owned blocked case and visible deidentification evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyHandlingDetails"
        "401":
          description: Authentication is required
        "404":
          description: Case is not available to this account
  /safety/cases/{safetyCaseId}/accept-deidentified:
    post:
      operationId: acceptDeidentifiedSafetySource
      summary: Explicitly accept the deidentified candidate
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SafetyCaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SafetyHandlingCommand"
      responses:
        "200":
          description: Candidate accepted
  /safety/cases/{safetyCaseId}/return-to-edit:
    post:
      operationId: returnBlockedSafetySourceToEdit
      summary: Release the blocked case back to the source editor
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SafetyCaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SafetyHandlingCommand"
      responses:
        "200":
          description: Source returned to edit
  /safety/cases/{safetyCaseId}/manual-reviews:
    post:
      operationId: submitSafetyManualReview
      summary: Submit an explicit user-requested manual review
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SafetyCaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SafetyHandlingCommand"
      responses:
        "200":
          description: Manual review submitted
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/ManualReviewSubmissionResult" }
  /safety/cases/manual-reviews/{reviewRequestId}:
    get:
      operationId: getManualReviewResult
      summary: Resolve one owned adjudicated manual review message target
      security:
        - bearerAuth: []
      parameters:
        - name: reviewRequestId
          in: path
          required: true
          schema: { type: string, maxLength: 128 }
      responses:
        "200":
          description: Adjudicated result with the temporary source needed for the confirmed next step
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualReviewResult" }
        "401": { description: Authentication is required }
        "404": { description: Result is pending, unavailable, or not owned }
  /messages:
    get:
      operationId: listAppMessages
      summary: List the current account's non-expired authoritative app messages
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Messages ordered newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppMessagesResponse" }
        "401": { description: Authentication is required }
  /messages/read-all:
    post:
      operationId: markAllAppMessagesRead
      summary: Mark all current account app messages as read
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Number of messages newly marked read
          content:
            application/json:
              schema:
                type: object
                required: [updatedCount]
                properties:
                  updatedCount: { type: integer, minimum: 0 }
        "401": { description: Authentication is required }
  /account/current:
    get:
      operationId: getCurrentAccountProfile
      summary: Read the authenticated account profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Verified account identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountProfile" }
        "401": { description: Authentication is required }
        "404": { description: Account is not available }
    delete:
      operationId: deleteCurrentAccount
      summary: Permanently delete the authenticated account and its server data
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountDeletionCommand" }
      responses:
        "200":
          description: Account deletion completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountDeletionResult" }
        "401": { description: Authentication is required }
        "404": { description: Account is not available }
  /billing/summary:
    get:
      operationId: getBillingSummary
      summary: Read the current account's available CNY balance and actual AI charge facts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authoritative available balance and newest charges
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingSummary" }
        "401": { description: Authentication is required }
        "404": { description: Billing subject is not available }
  /billing/recharge-config:
    get:
      operationId: getRechargeConfiguration
      summary: Read server-authoritative recharge options and amount limits
      responses:
        "200":
          description: Recharge page configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RechargeConfiguration" }
  /billing/recharge-orders:
    post:
      operationId: createRechargeOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RechargeOrderCommand" }
      responses:
        "201":
          description: Idempotently created payment order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RechargeOrderResult" }
        "400": { description: Invalid amount, method, or command replay }
        "401": { description: Authentication is required }
  /billing/recharge-orders/{orderId}:
    get:
      operationId: getRechargeOrder
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200":
          description: Current server-authoritative order state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RechargeOrderResult" }
        "401": { description: Authentication is required }
        "404": { description: Order is not owned or available }
  /billing/refunds/current:
    get:
      operationId: getCurrentRefund
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Server-calculated refundable balance and newest request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefundPage" }
        "401": { description: Authentication is required }
  /billing/refunds:
    post:
      operationId: requestRefund
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefundCommand" }
      responses:
        "201":
          description: Idempotently requested full refundable balance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefundResult" }
        "400":
          { description: Amount is not the current full refundable balance }
        "401": { description: Authentication is required }
  /billing/payment-events:
    post:
      operationId: applyPaymentEvent
      summary: Verify and atomically apply an idempotent payment-gateway callback
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentEventEnvelope" }
      responses:
        "201": { description: Verified callback accepted }
        "400":
          { description: Invalid, stale, mismatched, or malformed callback }
  /billing/minor-recharge-support:
    post:
      operationId: requestMinorRechargeSupport
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MinorRechargeSupportCommand" }
      responses:
        "201":
          description: Idempotently submitted a minor recharge support case
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/MinorRechargeSupportResult" }
        "400": { description: Invalid or conflicting support request }
        "401": { description: Authentication is required }
  /auth/sessions:
    post:
      operationId: createSession
      summary: Authenticate an email account and create a device session
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication outcome
          headers:
            x-request-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400":
          $ref: "#/components/responses/ValidationError"
  /auth/sessions/refresh:
    post:
      operationId: refreshSession
      summary: Rotate a valid refresh session for the same installation
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshSessionRequest"
      responses:
        "200":
          description: Refresh outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshSessionResult"
        "400":
          $ref: "#/components/responses/ValidationError"
  /auth/sessions/current:
    delete:
      operationId: revokeCurrentSession
      summary: Idempotently revoke the current refresh session
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeSessionRequest"
      responses:
        "200":
          description: Current session is revoked or already unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeSessionResult"
        "400":
          $ref: "#/components/responses/ValidationError"
  /auth/password-resets:
    post:
      operationId: requestPasswordReset
      summary: Neutrally request a password reset email with a stable command identity
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "200":
          description: Dispatch accepted without revealing account existence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetRequestResult"
        "400":
          $ref: "#/components/responses/ValidationError"
  /auth/password-resets/{challengeId}/verification:
    post:
      operationId: verifyPasswordReset
      summary: Exchange an active email link bearer for a short-lived reset token
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetVerificationRequest"
      responses:
        "200":
          description: Link verification outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetVerificationResult"
        "400":
          $ref: "#/components/responses/ValidationError"
  /auth/password-resets/completion:
    post:
      operationId: completePasswordReset
      summary: Atomically replace the password and revoke active sessions
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetCompletionRequest"
      responses:
        "200":
          description: Password reset completion outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetCompletionResult"
        "400":
          $ref: "#/components/responses/ValidationError"
  /health:
    get:
      operationId: getHealth
      summary: Check API readiness
      responses:
        "200":
          description: API is ready
          headers:
            x-request-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /auth/registrations:
    post:
      operationId: startRegistration
      summary: Start email registration after age and password checks
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationRequest"
      responses:
        "200":
          description: Registration was rejected locally or awaits email verification
          headers:
            x-request-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResult"
        "400":
          $ref: "#/components/responses/ValidationError"
  /auth/registrations/{registrationId}/verification:
    post:
      operationId: verifyRegistration
      summary: Verify the email bearer and create the account
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: registrationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationVerificationRequest"
      responses:
        "200":
          description: Verification outcome
          headers:
            x-request-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationVerificationResult"
        "400":
          $ref: "#/components/responses/ValidationError"
  /auth/registrations/{registrationId}/verification-email:
    post:
      operationId: resendRegistrationVerificationEmail
      summary: Resend an email for an active registration challenge
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: registrationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Resend outcome and server-controlled cooldown
          headers:
            x-request-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationVerificationEmailResendResult"
        "400":
          $ref: "#/components/responses/ValidationError"
  /auth/registrations/{registrationId}/verification-status:
    get:
      operationId: getRegistrationVerificationStatus
      summary: Read whether an email registration has completed
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: registrationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current registration verification status
          headers:
            x-request-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationVerificationStatusResult"
        "400":
          $ref: "#/components/responses/ValidationError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
  parameters:
    SafetyCaseId:
      name: safetyCaseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequestId:
      name: x-request-id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
  schemas:
    RecordingTranscriptionRequest:
      type: object
      additionalProperties: false
      required:
        [
          recordingId,
          durationSeconds,
          audioFormat,
          languageHint,
          endReason,
          audioBase64,
          commandId,
        ]
      properties:
        recordingId: { type: string, minLength: 1, maxLength: 128 }
        durationSeconds: { type: integer, minimum: 1, maximum: 120 }
        audioFormat: { type: string, enum: [audio/mp4, audio/wav] }
        languageHint: { type: string, enum: [zh-CN, auto] }
        endReason: { type: string, enum: [USER_STOPPED, MAX_DURATION, CAPTURE_WINDOW] }
        coreStartMs: { type: integer, minimum: 0, maximum: 120000 }
        coreEndMs: { type: integer, minimum: 1, maximum: 120000 }
        audioBase64:
          type: string
          minLength: 1
          maxLength: 8000000
          pattern: "^[A-Za-z0-9+/]+={0,2}$"
        commandId: { type: string, minLength: 1, maxLength: 128 }
    RecordingTranscriptSegment:
      type: object
      additionalProperties: false
      required:
        [
          segmentId,
          startMs,
          endMs,
          text,
          speakerLabel,
          confidence,
          alternatives,
          mostLikelyText,
          mostLikelyIsInference,
        ]
      properties:
        segmentId: { type: string, minLength: 1, maxLength: 128 }
        startMs: { type: integer, minimum: 0 }
        endMs: { type: integer, minimum: 0 }
        text: { type: string, minLength: 1 }
        speakerLabel: { type: string, enum: [USER, OTHER, UNKNOWN] }
        confidence: { type: [number, "null"], minimum: 0, maximum: 1 }
        alternatives:
          type: array
          items: { type: string }
        mostLikelyText: { type: [string, "null"] }
        mostLikelyIsInference: { type: boolean }
    RecordingTranscriptionResult:
      type: object
      additionalProperties: false
      required: [transcriptId, language, fullText, segments, finalBoundary]
      properties:
        transcriptId: { type: string, minLength: 1, maxLength: 128 }
        language: { type: string, minLength: 1, maxLength: 32 }
        fullText: { type: string, minLength: 1 }
        segments:
          type: array
          items: { $ref: "#/components/schemas/RecordingTranscriptSegment" }
        finalBoundary:
          type: object
          additionalProperties: false
          required: [acceptedEndMs, droppedIncompleteTail]
          properties:
            acceptedEndMs: { type: integer, minimum: 0 }
            droppedIncompleteTail: { type: boolean }
    TranscriptRepairRequest:
      type: object
      additionalProperties: false
      required:
        [
          transcriptId,
          currentText,
          manuallyEdited,
          audioFormat,
          audioBase64,
          commandId,
        ]
      properties:
        transcriptId: { type: string, minLength: 1, maxLength: 128 }
        currentText: { type: string, minLength: 1 }
        manuallyEdited: { type: boolean }
        audioFormat: { type: string, const: audio/mp4 }
        audioBase64:
          {
            type: string,
            minLength: 1,
            maxLength: 8000000,
            pattern: "^[A-Za-z0-9+/]+={0,2}$",
          }
        commandId: { type: string, minLength: 1, maxLength: 128 }
    TranscriptRepairResult:
      oneOf:
        - type: object
          additionalProperties: false
          required: [decision]
          properties:
            decision: { type: string, const: NO_CHANGE }
        - type: object
          additionalProperties: false
          required: [decision, repairedText, changes]
          properties:
            decision: { type: string, const: PROPOSE_CHANGES }
            repairedText: { type: string, minLength: 1 }
            changes:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required:
                  [originalText, proposedText, evidenceSegmentIds, reason]
                properties:
                  originalText: { type: string, minLength: 1 }
                  proposedText: { type: string, minLength: 1 }
                  evidenceSegmentIds:
                    type: array
                    items: { type: string, minLength: 1, maxLength: 128 }
                  reason:
                    {
                      type: string,
                      enum: [CONFIRMED_OMISSION, CONFIRMED_DISFLUENCY],
                    }
      discriminator: { propertyName: decision }
    SceneStart:
      oneOf:
        - {
            type: object,
            additionalProperties: false,
            required:
              [kind, recommendationId, shortTopicZh, whyRelevantZh, sourceRefs],
            properties:
              {
                kind: { type: string, const: RECOMMENDATION },
                recommendationId: { type: string, minLength: 1 },
                shortTopicZh: { type: string, minLength: 1 },
                whyRelevantZh: { type: string, minLength: 1 },
                sourceRefs:
                  { type: array, items: { type: string, minLength: 1 } },
              },
          }
        - {
            type: object,
            additionalProperties: false,
            required: [kind, templateId, titleZh, scopeZh],
            properties:
              {
                kind: { type: string, const: TEMPLATE },
                templateId: { type: string, minLength: 1 },
                titleZh: { type: string, minLength: 1 },
                scopeZh: { type: string, minLength: 1 },
              },
          }
        - {
            type: object,
            additionalProperties: false,
            required: [kind, description],
            properties:
              {
                kind: { type: string, const: DIRECT_DESCRIPTION },
                description: { type: string, minLength: 1 },
              },
          }
      discriminator: { propertyName: kind }
    SceneAnswer:
      type: object
      additionalProperties: false
      required: [questionId, answerZh]
      properties:
        {
          questionId: { type: string, minLength: 1, maxLength: 128 },
          questionZh: { type: string, minLength: 1 },
          answerZh: { type: string, minLength: 1 },
        }
    SceneUnit:
      type: object
      additionalProperties: false
      required: [unitId, speaker, textZh, factReferences]
      properties:
        unitId: { type: string, minLength: 1, maxLength: 128 }
        speaker: { type: [string, "null"], enum: [USER, OTHER, null] }
        textZh: { type: string, minLength: 1 }
        factReferences: { type: array, items: { type: string } }
    SceneRecommendationRequest:
      type: object
      additionalProperties: false
      required: [sources, commandId]
      properties:
        sources:
          type: array
          maxItems: 12
          items:
            type: object
            additionalProperties: false
            required:
              [
                sourceId,
                sourceType,
                completedLocalDate,
                topicSummaryZh,
                confirmedTextZh,
                sceneContextZh,
              ]
            properties:
              sourceId: { type: string, minLength: 1, maxLength: 128 }
              sourceType:
                { type: string, enum: [DIARY, QUICK_RECORDING, AI_SCENE] }
              completedLocalDate: { type: string, format: date }
              topicSummaryZh: { type: string, minLength: 1 }
              confirmedTextZh: { type: string, minLength: 1 }
              sceneContextZh: { type: string }
        commandId: { type: string, minLength: 1, maxLength: 128 }
    SceneRecommendationResult:
      type: object
      additionalProperties: false
      required: [recommendations]
      properties:
        recommendations:
          type: array
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            required:
              [
                recommendationId,
                shortTopicZh,
                whyRelevantZh,
                sourceRefs,
                differentiationKey,
              ]
            properties:
              recommendationId: { type: string, minLength: 1, maxLength: 128 }
              shortTopicZh: { type: string, minLength: 1 }
              whyRelevantZh: { type: string, minLength: 1 }
              sourceRefs: { type: array, items: { type: string, minLength: 1 } }
              differentiationKey: { type: string, minLength: 1 }
    SceneNextQuestionRequest:
      type: object
      additionalProperties: false
      required:
        [
          operationId,
          start,
          contentType,
          confirmedAnswers,
          remainingQuestions,
          remainingContentBudget,
          stepIndex,
          commandId,
        ]
      properties:
        operationId: { type: string, minLength: 1, maxLength: 128 }
        start: { $ref: "#/components/schemas/SceneStart" }
        contentType: { type: string, enum: [DIALOGUE, ARTICLE] }
        confirmedAnswers:
          {
            type: array,
            maxItems: 10,
            items: { $ref: "#/components/schemas/SceneAnswer" },
          }
        remainingQuestions: { type: integer, minimum: 0, maximum: 10 }
        remainingContentBudget: { type: integer, minimum: 3, maximum: 10 }
        stepIndex: { type: integer, minimum: 0, maximum: 10 }
        commandId: { type: string, minLength: 1, maxLength: 128 }
    SceneNextQuestionResult:
      oneOf:
        - {
            type: object,
            additionalProperties: false,
            required: [action, questionId, questionZh, options],
            properties:
              {
                action: { type: string, const: ASK },
                questionId: { type: string, minLength: 1 },
                questionZh: { type: string, minLength: 1 },
                options: { type: array, items: { type: string } },
              },
          }
        - {
            type: object,
            additionalProperties: false,
            required: [action, collectedFacts, missingNonBlockingFacts],
            properties:
              {
                action: { type: string, const: GENERATE },
                collectedFacts: { type: array, items: { type: string } },
                missingNonBlockingFacts:
                  { type: array, items: { type: string } },
              },
          }
        - {
            type: object,
            additionalProperties: false,
            required: [action],
            properties:
              { action: { type: string, const: INSUFFICIENT_INFORMATION } },
          }
      discriminator: { propertyName: action }
    SceneDraftRequest:
      type: object
      additionalProperties: false
      required: [task, session, remainingContentBudget, commandId]
      properties:
        task:
          {
            type: string,
            enum: [SCENE_DIALOGUE_TURN_V1, SCENE_ARTICLE_DRAFT_V1],
          }
        session:
          type: object
          required:
            [
              operationId,
              start,
              contentType,
              answers,
              collectedFacts,
              missingNonBlockingFacts,
            ]
          properties:
            operationId: { type: string, minLength: 1, maxLength: 128 }
            start: { $ref: "#/components/schemas/SceneStart" }
            contentType: { type: string, enum: [DIALOGUE, ARTICLE] }
            answers:
              {
                type: array,
                minItems: 1,
                maxItems: 10,
                items: { $ref: "#/components/schemas/SceneAnswer" },
              }
            collectedFacts: { type: array, items: { type: string } }
            missingNonBlockingFacts: { type: array, items: { type: string } }
        remainingContentBudget: { type: integer, minimum: 3, maximum: 10 }
        commandId: { type: string, minLength: 1, maxLength: 128 }
        previousUnits:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: "#/components/schemas/SceneUnit" }
          description: Previous visible draft supplied only for user-requested regeneration.
    SceneDraftResult:
      type: object
      additionalProperties: false
      required: [draftId, contentType, units]
      properties:
        draftId: { type: string, minLength: 1, maxLength: 128 }
        contentType: { type: string, enum: [DIALOGUE, ARTICLE] }
        units:
          {
            type: array,
            minItems: 3,
            maxItems: 10,
            items: { $ref: "#/components/schemas/SceneUnit" },
          }
    SceneEditReviewRequest:
      type: object
      additionalProperties: false
      required:
        [contentType, changedUnitIds, originalUnits, editedUnits, commandId]
      properties:
        contentType: { type: string, enum: [DIALOGUE, ARTICLE] }
        changedUnitIds:
          { type: array, minItems: 1, items: { type: string, minLength: 1 } }
        originalUnits:
          {
            type: array,
            minItems: 1,
            maxItems: 10,
            items: { $ref: "#/components/schemas/SceneUnit" },
          }
        editedUnits:
          {
            type: array,
            minItems: 1,
            maxItems: 10,
            items: { $ref: "#/components/schemas/SceneUnit" },
          }
        commandId: { type: string, minLength: 1, maxLength: 128 }
    SceneEditReviewResult:
      oneOf:
        - {
            type: object,
            additionalProperties: false,
            required: [decision],
            properties: { decision: { type: string, const: PASS } },
          }
        - type: object
          additionalProperties: false
          required: [decision, issues]
          properties:
            decision: { type: string, const: NEEDS_USER_EDIT }
            issues:
              type: array
              minItems: 1
              items:
                type: object
                required:
                  [unitId, startOffset, endOffset, reason, explanationZh]
                properties:
                  unitId: { type: string, minLength: 1, maxLength: 128 }
                  startOffset: { type: integer, minimum: 0 }
                  endOffset: { type: integer, minimum: 1 }
                  reason:
                    {
                      type: string,
                      enum:
                        [
                          REQUIRED_INFORMATION_MISSING,
                          CONTRADICTION,
                          UNINTELLIGIBLE,
                          SEVERELY_UNNATURAL,
                        ],
                    }
                  explanationZh: { type: string, minLength: 1 }
      discriminator: { propertyName: decision }
    ReadingFeedbackRequest:
      type: object
      additionalProperties: false
      required:
        [
          chapterId,
          sentenceId,
          targetTextEn,
          completionSignal,
          audioMimeType,
          audioBase64,
          commandId,
        ]
      properties:
        chapterId:
          type: string
          minLength: 1
          maxLength: 128
        sentenceId:
          type: string
          minLength: 1
          maxLength: 128
        targetTextEn:
          type: string
          minLength: 1
          maxLength: 1000
        completionSignal:
          type: string
          enum: [TOUCH_REACHED_END, RECOGNITION_COMPLETE, MANUAL_CONFIRMATION]
        audioMimeType:
          type: string
          const: audio/mp4
        audioBase64:
          type: string
          minLength: 1
          maxLength: 900000
        commandId:
          type: string
          minLength: 1
          maxLength: 128
    ReadingFeedbackResult:
      type: object
      additionalProperties: false
      required:
        [
          feedbackZh,
          feedbackItems,
          transcript,
          contentComplete,
          feedbackConfidence,
          action,
        ]
      properties:
        feedbackZh:
          type: string
          minLength: 1
        feedbackItems:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required:
              [aspect, targetText, observationZh, suggestionZh, evidence]
            properties:
              aspect:
                type: string
                enum: [WORD_OR_PHRASE, RHYTHM, COMPLETENESS]
              targetText:
                type: [string, "null"]
                minLength: 1
              observationZh:
                type: string
                minLength: 1
              suggestionZh:
                type: string
                minLength: 1
              evidence:
                type: string
                enum: [AUDIO, TRANSCRIPT, GENERAL]
        transcript:
          type: string
        contentComplete:
          type: boolean
        feedbackConfidence:
          type: number
          minimum: 0
          maximum: 1
        action:
          type: string
          enum: [CONTINUE, REPEAT_FOR_CLARITY]
    SpeakingTranscriptionRequest:
      type: object
      additionalProperties: false
      required: [chapterId, sentenceId, audioMimeType, audioBase64, commandId]
      properties:
        chapterId:
          type: string
          minLength: 1
          maxLength: 128
        sentenceId:
          type: string
          minLength: 1
          maxLength: 128
        audioMimeType:
          type: string
          const: audio/mp4
        audioBase64:
          type: string
          minLength: 1
          maxLength: 900000
          pattern: "^[A-Za-z0-9+/]+={0,2}$"
        commandId:
          type: string
          minLength: 1
          maxLength: 128
    SpeakingTranscriptionResult:
      type: object
      additionalProperties: false
      required: [transcript, lowConfidenceSegments, confidence]
      properties:
        transcript:
          type: string
