      type: object
      additionalProperties: false
      required: [chapterId, sentences]
      properties:
        chapterId:
          type: string
          minLength: 1
          maxLength: 128
        sentences:
          type: array
          minItems: 1
          maxItems: 4
          items:
            $ref: "#/components/schemas/FixedExplanationSentence"
    FixedExplanationSentence:
      type: object
      additionalProperties: false
      required: [sentenceId, textEn, textZh, isFocus]
      properties:
        sentenceId:
          type: string
          minLength: 1
          maxLength: 128
        textEn:
          type: string
          minLength: 1
        textZh:
          type: string
          minLength: 1
        isFocus:
          type: boolean
    RequestedExpression:
      type: object
      additionalProperties: false
      required: [expressionId, display]
      properties:
        expressionId:
          type: string
          minLength: 1
          maxLength: 128
        display:
          type: string
          minLength: 1
        startUtf16:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Paired with endUtf16. Required whenever lockedTargets is present. Exact UTF-16 full-word or natural-phrase start in the current fixed focus sentence, not a position inferred from repeated spelling.
        endUtf16:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: Exclusive UTF-16 end; must be greater than startUtf16 and the exact source substring must equal display. Both offsets may be absent only for legacy requests.
    LockedExplanationVocabulary:
      type: object
      additionalProperties: false
      required: [display, senseZh, unitType, sourceEvidence]
      properties:
        display: { type: string, pattern: '\S' }
        senseZh: { type: string, pattern: '\S' }
        unitType: { type: string, enum: [WORD, FIXED_EXPRESSION] }
        sourceEvidence:
          $ref: "#/components/schemas/RelatedVocabularyItem/properties/sourceEvidence"
    LockedExplanationTarget:
      type: object
      additionalProperties: false
      required:
        [
          targetId,
          type,
          display,
          explanationZh,
          structureParts,
          sourceEvidence,
          relatedVocabulary,
        ]
      description: One actually selected current-focus target. IDs and actual vocabulary occurrences are unique. Same-occurrence vocabulary metadata must agree exactly across actual targets and pattern explanations. No formal knowledge identity or learning state is inferred from this input.
      properties:
        targetId: { type: string, maxLength: 128, pattern: '\S' }
        type: { type: string, enum: [WORD, FIXED_EXPRESSION, PATTERN] }
        display: { type: string, pattern: '\S' }
        explanationZh: { type: string, pattern: '\S' }
        structureParts:
          type: array
          description: Nonblank elements; PATTERN with nonnull sourceEvidence requires at least one real structure part. Legacy null evidence permits an empty array without invented decomposition.
          items: { type: string, pattern: '\S' }
        sourceEvidence:
          anyOf:
            - $ref: "#/components/schemas/RelatedVocabularyItem/properties/sourceEvidence"
            - { type: "null" }
          description: Null means a legacy unknown occurrence; no repeated-word location may be invented.
        relatedVocabulary:
          type: [array, "null"]
          description: Resolved pattern-associated explanations, never additional selected targets. Null means legacy unknown. Non-pattern targets may only have an empty array or legacy null.
          items:
            $ref: "#/components/schemas/LockedExplanationVocabulary"
    LearningExplanationRecoveryResult:
