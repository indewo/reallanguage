        email: { type: string, format: email, maxLength: 320 }
    AccountDeletionCommand:
      type: object
      additionalProperties: false
      required: [commandId]
      properties:
        commandId: { type: string, minLength: 1, maxLength: 128 }
    AccountDeletionResult:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: DELETED }
    BillingSummary:
      type: object
      additionalProperties: false
      required: [balanceAmountFen, charges]
      properties:
        balanceAmountFen: { type: integer, minimum: 0, maximum: 100000000 }
        charges:
          type: array
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required:
              [
                chargeId,
                amountFen,
                occurredAt,
                modelSource,
                callType,
                operationLabelZh,
              ]
