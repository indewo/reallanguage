                    PROCESSING,
                    FAILED,
                    EXPIRED,
                    INVALID_DELIVERY,
                    BILLING_UNVERIFIED,
                    PENDING_SETTLEMENT,
                    RELEASED,
                    RECONCILIATION_REQUIRED,
                    INVALID_RESULT,
