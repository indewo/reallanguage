<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>手写抄写操作区调整方案</title>
<style>
@font-face{font-family:Paper;src:url('../../../apps/android/app/src/main/res/font/noto_serif_sc_variable.ttf')}
*{box-sizing:border-box}body{margin:0;background:#f8f5ef;color:#071a33;font-family:Paper,'SimSun',serif}
main{width:1896px;height:830px;padding:24px 72px;background:linear-gradient(#f8f5efeb,#f8f5efeb),url('../../../apps/android/app/src/main/res/drawable-nodpi/rl_paper_background.png')}
header{height:112px;display:flex;align-items:flex-start;position:relative;padding-top:6px}h1{font-size:44px;margin:0;position:absolute;left:0;right:0;text-align:center;font-weight:700}nav{font-size:29px;z-index:1;padding-top:9px}.underline{position:absolute;top:72px;left:43%;width:290px;border-top:2px solid #b45742;transform:rotate(-2deg)}
.sentence{height:106px;display:flex;align-items:center;padding:20px 40px;background:#fcfaf6;box-shadow:0 2px 2px #071a3310;border-bottom:2px solid #e1d8ca;font-size:29px}.english{width:61%}.chinese{border-left:1px solid #c8c1b5;padding-left:44px}.arrow{color:#b45742;font-size:21px;margin-right:25px}
.workspace{display:grid;grid-template-columns:270px 1fr;gap:46px;margin-top:36px;height:462px}.note{background:#65734d;color:#fcfaf6;padding:36px 26px;display:flex;flex-direction:column;text-align:center;justify-content:space-between}.note h2{font-size:28px;margin:0;line-height:1.7}.count{font-size:20px;line-height:1.7;background:#f8f5ef18;padding:15px}
.writing{display:flex;flex-direction:column;gap:18px}.paper{height:354px;background:repeating-linear-gradient(transparent 0 44px,#a9b7ba80 45px,transparent 46px),linear-gradient(90deg,transparent 0 82px,#c97b5f80 83px,transparent 85px),#fcfaf6;box-shadow:1px 3px 5px #071a3314;border-bottom:3px solid #ded5c8;position:relative}.stroke{position:absolute;left:170px;top:70px;font-style:italic;font-family:Georgia,serif;font-size:100px;color:#4b6572;transform:rotate(-4deg)}
.toolbar{display:flex;align-items:center;justify-content:flex-end;gap:24px;height:90px}.hint{font:18px Paper,serif;color:#69736f;flex:1}button{font:27px Paper,serif;height:76px;border:1px solid #b7b8ae;background:transparent;color:#51626a;border-radius:7px;padding:0 36px}.primary{background:#b45742;color:#fff;border:0;width:400px}.caption{margin-top:18px;color:#6c746e;font-size:19px}
</style>
<main><header><nav>← 退出学习</nav><h1>第 1 章 · 手写抄写</h1><div class="underline"></div></header>
<section class="sentence"><div class="english"><span class="arrow">▶</span>You just got off the subway and transferred to a bus,</div><div class="chinese">你刚从地铁下来，又换乘了公交车，</div></section>
<section class="workspace"><aside class="note"><h2>照着当前句<br>完整抄写</h2><div class="count">第 1 次<br>至少完成 2 次</div></aside><div class="writing"><div class="paper"><span class="stroke">You</span></div><div class="toolbar"><button>清空重写</button><button class="primary">我已写完</button></div></div></section>
</main></html>
